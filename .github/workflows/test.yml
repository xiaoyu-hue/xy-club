name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    name: Unit (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    # 防挂保护：去掉了 Node 18 不支持的 --test-timeout 后，用作业级超时兜底，
    # 避免某个用例意外卡死把整个 CI 跑成无期限挂起。对所有 Node 版本都生效。
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: ['18', '20', '22']
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # 用 ci 而非 install：严格按 package-lock.json 安装，能立刻暴露 lockfile 漂移。
      # （v1.8.0 之前 lockfile 缺失 eslint 依赖树，改用 ci 后这类问题不会再潜伏。）
      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      # v1.11.0 起 lint 是硬门禁（--max-warnings 0）：
      # 以前 159 条警告被长期无视，lint 只剩「没写分号」一个信号。
      - name: Lint（质量门：任何 error 或 warning 都会阻断 CI）
        run: npm run lint

      - name: 运行单元测试
        run: npm test

  e2e:
    name: E2E（Chromium 冒烟）
    runs-on: ubuntu-latest
    # v1.11.0：E2E 进 CI。它是唯一能证明「后台点得动、保存真的生效」的检查，
    # 而这两条此前只有人工验证。只在 Node 22 上跑一份，控制总时长。
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 缓存 Playwright 浏览器
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: 安装 Chromium
        run: npx playwright install --with-deps chromium

      # FORCE_E2E=1：缺 Playwright 时明确失败，而不是静默「跳过」后再报绿。
      - name: 运行端到端测试
        run: npm run test:e2e
        env:
          FORCE_E2E: '1'

      - name: 失败时上传 Playwright 报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
